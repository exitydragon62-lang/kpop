<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPOP</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{height:100%;margin:0}
body{background:#111;color:#fff;font-family:'Courier New',monospace;display:flex;justify-content:center;align-items:center;overflow:hidden}
#g{position:relative;width:min(100vw,177.78vh);width:min(100vw,177.78dvh);aspect-ratio:16/9;background:#2b2540;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:6px;left:8px;right:8px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:2px 2px #000;pointer-events:none;font-size:14px}
#sp{position:absolute;top:28px;left:8px;width:100px;height:10px;border:2px solid #fff;background:rgba(0,0,0,.5);pointer-events:none}
#spf{height:100%;width:0}
.scr{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:10;padding:10px}
.scr h1{margin:0 0 8px;font-size:clamp(20px,6vw,36px);color:#ff7ad9;letter-spacing:4px}
.scr p{margin:0 0 10px;font-size:12px}
.cs{display:flex;gap:8px;margin-bottom:12px}
.cc{border:3px solid #fff;border-radius:8px;padding:8px;width:30%;max-width:120px;cursor:pointer;background:rgba(255,255,255,.1)}
.cc.sel{border-color:#FFD700;background:rgba(255,215,0,.3)}
.cc h3{margin:0 0 3px;font-size:14px}.cc small{font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:#fc0;color:#000;border:0;padding:10px 20px;font:bold 14px 'Courier New',monospace;border-radius:6px;box-shadow:0 4px #b8860b;cursor:pointer}
.btn-alt{background:#444;color:#fff;box-shadow:0 4px #222}
#ctl{position:absolute;bottom:8px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.grp{display:flex;gap:8px;pointer-events:auto}
.cb{width:clamp(42px,11vw,56px);height:clamp(42px,11vw,56px);border-radius:50%;background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.cb:active{background:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div id="g">
  <div id="menu" class="scr">
    <h1>KPOP</h1>
    <p>Escolha seu herói e chegue na saída!<br><small>Dica: vire o celular para o modo paisagem 🔄</small></p>
    <div class="cs">
      <div class="cc sel" data-c="purple"><h3 style="color:#c06cf0">Roxo</h3><small>Cantora</small></div>
      <div class="cc" data-c="red"><h3 style="color:#ff4444">Vermelho</h3><small>Gata</small></div>
      <div class="cc" data-c="blue"><h3 style="color:#5a9bff">Azul</h3><small>Monstra</small></div>
    </div>
    <div class="btn-group">
      <button class="btn" id="play">JOGAR</button>
      <button class="btn btn-alt" id="resetSave">RESETAR SAVE</button>
    </div>
  </div>
  <div id="nxt" class="scr" style="display:none"><h1 id="nxTitle">FASE 2</h1><p>Progresso salvo! Continue sua jornada.<br>Seu especial continua com você.</p><button class="btn" id="nx">CONTINUAR</button></div>
  <div id="over" class="scr" style="display:none"><h1 style="color:#f33">VOCÊ MORREU!</h1><p>Os seguranças te pegaram desta vez…</p><button class="btn" id="r1">TENTAR DE NOVO</button></div>
  <div id="win" class="scr" style="display:none"><h1 style="color:#3f3">CAMPANHA CONCLUÍDA!</h1><p id="wt"></p><button class="btn" id="r2">JOGAR DE NOVO</button></div>
  <canvas id="c" width="800" height="450"></canvas>
  <div id="hud"><span id="hp"></span><span id="pr"></span></div>
  <div id="sp"><div id="spf"></div></div>
  <div id="ctl">
    <div class="grp"><div class="cb" id="bl">◀</div><div class="cb" id="br">▶</div></div>
    <div class="grp"><div class="cb" id="bs">⚡</div><div class="cb" id="bp">👊</div><div class="cb" id="bj">▲</div></div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const W=3400,EXIT=3250,STUDIO=1100;
const CH={purple:{col:'#9b4de0',spd:3.8,jmp:-10.5,reach:0},red:{col:'#e02d2d',spd:3.2,jmp:-11,reach:42},blue:{col:'#2f7bff',spd:2.8,jmp:-11.5,reach:60}};
const TYPE={purple:'blue',red:'purple',blue:'red'};
const LV=[
 {name:"FASE 1: Estúdio", en:[[550,380],[850,380],[1400,380],[1780,380],[2000,380],[2300,380],[2630,380],[2980,380]],gap:140,max:6},
 {name:"FASE 2: Ruas do Bairro", en:[[450,380],[700,380],[1000,380],[1250,380],[1500,380],[1700,380],[1900,380],[2150,380],[2500,380],[2700,380],[3000,380]],gap:80,max:10},
 {name:"FASE 3: Praça Central", en:[[400,380],[750,380],[1100,380],[1450,380],[1850,380],[2200,380],[2600,380],[2950,380]],gap:90,max:8},
 {name:"FASE 4: Zona Comercial", en:[[350,380],[600,380],[950,380],[1250,380],[1650,380],[2050,380],[2450,380],[2800,380],[3100,380]],gap:85,max:10},
 {name:"FASE 5: Avenida dos Arcos", en:[[400,380],[700,380],[1100,380],[1500,380],[1900,380],[2300,380],[2750,380],[3050,380]],gap:80,max:11},
 {name:"FASE 6: Praia da Metrópole", en:[[450,380],[850,380],[1250,380],[1650,380],[2050,380],[2450,380],[2850,380],[3100,380]],gap:75,max:12},
 {name:"FASE 7: O Restaurante", en:[[400,380],[700,380],[1100,380],[1500,380],[1900,380],[2300,380],[2700,380],[3050,380]],gap:80,max:10}
];
let st='MENU',hero='purple',camX=0,tick=0,kills=0,lvl=0;
let P,plats,en,cars=[],wv=[],K={l:0,r:0};

function getSavedLvl(){return parseInt(localStorage.getItem('kpop_lvl_'+hero)||'0',10);}
function saveLvl(l){localStorage.setItem('kpop_lvl_'+hero, l.toString());}

document.querySelectorAll('.cc').forEach(e=>e.onclick=()=>{
  hero=e.dataset.c;
  document.querySelectorAll('.cc').forEach(x=>x.classList.remove('sel'));
  e.classList.add('sel');
});

$('resetSave').onclick=()=>{
  localStorage.removeItem('kpop_lvl_'+hero);
  alert('Progresso do herói ' + hero + ' resetado!');
};

function spawn(x){
  let isRestaurante = (lvl === 6);
  let isGuard = !isRestaurante && lvl >= 2 && Math.random() < 0.35;
  en.push({
    x, y: 380-46, w: 26, h: 46,
    vx: (Math.random()<.5?-1:1)*(1+Math.random()*.6),
    min: Math.max(10,x-150), max: Math.min(W-40,x+150),
    pmin: 10, pmax: W-40,
    alive: 1, ch: 0,
    isRestaurante: isRestaurante,
    isGuard: isGuard,
    hp: isGuard ? 2 : 1,
    col: isRestaurante ? '#ffffff' : (isGuard ? '#b82828' : ['#16213e','#1b1b1b','#2c3e50'][Math.floor(Math.random()*3)])
  });
}

function loadLevel(i){
  lvl=i;const L=LV[i];
  // Apenas o chão principal (sem plataformas flutuantes)
  plats=[{x:0,y:380,w:W,h:70}];
  en=[];cars=[];wv=[];tick=0;camX=0;
  L.en.forEach(a=>spawn(a[0]));
  P.x=80;P.y=332;P.vx=0;P.vy=0;P.safe=60;
}

function start(){
  const c=CH[hero];
  P={x:80,y:332,w:24,h:48,s:1,vx:0,vy:0,g:false,hp:3,f:1,punch:0,punchCombo:0,punchCooldown:0,claw:0,inv:0,safe:0,sc:0,dash:0,dEnd:0,mon:0,mEnd:0,spd:c.spd,jmp:c.jmp};
  kills=0;K.l=K.r=0;
  const col=hero==='purple'?'#c06cf0':hero==='red'?'#ff4444':'#5a9bff';
  $('spf').style.background=col;$('bs').style.background=col+'99';
  
  let saved = getSavedLvl();
  if(saved >= LV.length) saved = 0;
  loadLevel(saved);
  hud();
  ['menu','over','win','nxt'].forEach(i=>$(i).style.display='none');st='PLAY';
}

function hud(){
  const tot=P.mon?6:3;
  $('hp').textContent='❤'.repeat(Math.max(P.hp,0))+'♡'.repeat(Math.max(tot-P.hp,0));
  $('spf').style.width=P.sc/5*100+'%';
}

const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function fixPlat(){plats.forEach((p,i)=>{if(hit(P,p))P.y=p.y-P.h})}
function jump(){if(st==='PLAY'&&P.g&&!P.dash){P.vy=P.jmp*(P.mon?1.15:1);P.g=false}}

function punch(){
  if(st!=='PLAY'||P.dash||P.punchCooldown>0)return;
  P.punch=12;
  P.punchCombo++;
  
  if(hero==='purple'){
    wv.push({x:P.f>0?P.x+P.w:P.x-20,y:P.y+P.h*.28-10,w:20,h:20,vx:P.f*7,life:45,big:0});
  } else {
    const r=CH[hero].reach*P.s;
    const b={x:P.f>0?P.x+P.w:P.x-r,y:P.y,w:r+P.w,h:P.h};
    en.forEach(e=>{if(e.alive&&hit(b,e)) damageEnemy(e)});
  }

  if(P.punchCombo>=3){
    P.punchCooldown=120;
    P.punchCombo=0;
  }
}

function damageEnemy(e,nc){
  e.hp--;
  if(e.hp<=0){
    e.alive=0;kills++;
    if(hero==='red')P.claw=16;
    if(!nc&&P.sc<5&&!P.dash&&!P.mon){P.sc++;hud()}
  }
}

function startMon(){
  P.mon=1;P.mEnd=Date.now()+5000;P.s=2;
  P.y-=48;P.x-=12;P.w=48;P.h=96;P.hp=Math.min(P.hp*2,6);
}

function endMon(){
  P.mon=0;P.y+=P.h-48;P.h=48;P.x+=12;P.w=24;P.s=1;
  P.hp=Math.max(1,Math.ceil(P.hp/2));P.safe=45;hud();fixPlat();
}

function special(){
  if(st!=='PLAY'||P.sc<5||P.dash||P.mon)return;
  P.sc=0;
  if(hero==='red'){P.dash=1;P.inv=0;P.dEnd=Date.now()+2000}
  else if(hero==='blue')startMon();
  else wv.push({x:P.f>0?P.x+P.w:P.x-70,y:P.y+P.h-230,w:70,h:230,vx:P.f*9,life:80,big:1});
  hud();
}

function dmg(n){
  if(P.dash)return;
  P.hp-=n;hud();
  if(P.hp<=0){st='OVER';$('over').style.display='flex'}else{P.inv=70;P.vy=-6}
}

addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')K.l=1;
  if(e.code==='ArrowRight'||e.code==='KeyD')K.r=1;
  if(!e.repeat){
    if(['ArrowUp','KeyW','Space'].includes(e.code))jump();
    if(e.code==='KeyK'||e.code==='KeyX')punch();
    if(e.code==='KeyJ'||e.code==='KeyZ')special();
  }
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')K.l=0;
  if(e.code==='ArrowRight'||e.code==='KeyD')K.r=0;
});

function bind(id,down,up){
  const el=$(id);
  ['touchstart','mousedown'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();down()},{passive:false}));
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();up&&up()},{passive:false}));
}
bind('bl',()=>K.l=1,()=>K.l=0);bind('br',()=>K.r=1,()=>K.r=0);
bind('bj',jump);bind('bp',punch);bind('bs',special);

$('play').onclick=()=>{
  start();
  try{const r=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
    if(r&&r.then)r.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')).catch(()=>{});}catch(e){}
};

$('nx').onclick=()=>{
  $('nxt').style.display='none';
  if(lvl<LV.length){
    loadLevel(lvl);
    st='PLAY';
  } else {
    st='WIN';$('wt').textContent='Inimigos derrotados: '+kills;$('win').style.display='flex';
  }
};

$('r1').onclick=$('r2').onclick=()=>{$('over').style.display=$('win').style.display='none';$('menu').style.display='flex';st='MENU'};

function update(){
  if(st!=='PLAY')return;
  tick++;
  if(P.inv)P.inv--;if(P.safe)P.safe--;if(P.claw)P.claw--;if(P.punch)P.punch--;
  if(P.punchCooldown>0)P.punchCooldown--;
  
  const now=Date.now();
  if(P.dash&&now>=P.dEnd){P.dash=0;P.safe=45;P.inv=0;fixPlat()}
  if(P.mon&&now>=P.mEnd)endMon();
  if(P.dash){
    P.vx=P.f*P.spd*2;P.vy=0;P.y=380-P.h;P.g=true;P.inv=0;
    en.forEach(e=>{if(e.alive&&hit(P,e))damageEnemy(e,true)});
  }else{
    P.vx=K.l?-P.spd:K.r?P.spd:0;
    if(P.vx)P.f=P.vx>0?1:-1;
    P.vy+=.5;
  }
  P.x+=P.vx;
  P.x=Math.max(0,Math.min(W-P.w,P.x));
  if(!P.dash){
    plats.forEach(p=>{if(hit(P,p)){P.x=P.vx>0?p.x-P.w:P.vx<0?p.x+p.w:P.x}});
    P.y+=P.vy;P.g=false;
    plats.forEach(p=>{if(hit(P,p)){
      if(P.vy>0){P.y=p.y-P.h;P.vy=0;P.g=true}
      else if(P.vy<0){P.y=p.y+p.h;P.vy=0}
    }});
  }
  
  // Carros na rua das fases 3 até 6 (lvl 2 a 5)
  if(lvl >= 2 && lvl < 6) {
    if(tick % 160 === 0 && cars.length < 3) {
      let dir = Math.random() < 0.5 ? 1 : -1;
      let startX = dir > 0 ? camX - 180 : camX + 950;
      cars.push({
        x: startX, y: 335, w: 90, h: 38,
        vx: dir * (4.5 + Math.random()*2.5),
        col: ['#e74c3c','#3498db','#f1c40f','#9b59b6','#e67e22'][Math.floor(Math.random()*5)],
        dir: dir
      });
    }
  }
  cars.forEach(car => {
    car.x += car.vx;
    if(!P.dash && !P.safe && hit(P, car)) {
      if(!P.inv) dmg(1);
    }
  });
  cars = cars.filter(car => car.x > camX - 300 && car.x < camX + 1100);

  const L=LV[lvl];
  if(tick%L.gap===0&&en.filter(e=>e.alive).length<L.max){
    const lo=camX+830;
    if(lo < EXIT-120) spawn(lo);
  }
  wv=wv.filter(w=>{
    w.x+=w.vx;w.life--;
    en.forEach(e=>{if(e.alive&&w.life>0&&hit(w,e)){damageEnemy(e,w.big);if(!w.big)w.life=0}});
    return w.life>0;
  });
  en.forEach(e=>{
    if(!e.alive)return;
    e.ch=lvl>0&&!P.dash&&Math.abs(P.x-e.x)<340&&Math.abs((P.y+P.h)-(e.y+e.h))<80;
    if(e.ch){const d=P.x>e.x?1:-1;e.x=Math.max(e.pmin,Math.min(e.pmax,e.x+d*2.1));e.vx=d*Math.abs(e.vx)}
    else{e.x+=e.vx;if(e.x<=e.min||e.x>=e.max)e.vx*=-1}
    if(!P.dash&&!P.safe&&hit(P,e)){
      if(P.vy>1&&P.y+P.h-e.y<18){damageEnemy(e);P.vy=-7}
      else if(!P.inv)dmg(1);
    }
  });
  camX=Math.max(0,Math.min(W-800,P.x-270));
  $('pr').textContent='Fase '+(lvl+1)+' · '+Math.min(100,Math.floor(P.x/EXIT*100))+'%';
  if(P.x>=EXIT){
    if(lvl+1 < LV.length){
      st='NEXT';
      lvl++;
      saveLvl(lvl);
      $('nxTitle').textContent = LV[lvl].name;
      $('nxt').style.display='flex';
    } else {
      st='WIN';
      saveLvl(LV.length);
      $('wt').textContent='Inimigos derrotados: '+kills;
      $('win').style.display='flex';
    }
  }
}

function stick(x,y,col,f,pun,reach,type,mon){
  ctx.strokeStyle=ctx.fillStyle=col;ctx.lineWidth=3;ctx.lineCap='round';
  const hx=x+12,ext=pun&&type!=='blue';
  ctx.beginPath();ctx.arc(hx,y+10,8,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(hx,y+18);ctx.lineTo(hx,y+34);
  ctx.moveTo(hx,y+34);ctx.lineTo(hx-9,y+48);ctx.moveTo(hx,y+34);ctx.lineTo(hx+9,y+48);
  ctx.moveTo(hx,y+22);ctx.lineTo(hx+f*(ext?reach+8:type==='blue'?10:9),ext?y+22:type==='blue'?y+14:y+34);
  ctx.moveTo(hx,y+22);ctx.lineTo(hx-f*9,y+34);
  ctx.stroke();
  if(type==='purple'){
    ctx.beginPath();ctx.moveTo(hx-8,y+6);ctx.lineTo(hx-7,y-6);ctx.lineTo(hx-1,y+2);ctx.fill();
    ctx.beginPath();ctx.moveTo(hx+8,y+6);ctx.lineTo(hx+7,y-6);ctx.lineTo(hx+1,y+2);ctx.fill();
    ctx.beginPath();ctx.moveTo(hx,y+34);ctx.quadraticCurveTo(hx-f*22,y+36,hx-f*18,y+18);ctx.stroke();
    if(pun){
      const fx=hx+f*(reach+8);
      for(const [c,w] of [['#fff',3],[col,1.5]]){ctx.strokeStyle=c;ctx.lineWidth=w;
        for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(fx-f*8,y+8+i*8);ctx.lineTo(fx+f*10,y+20+i*8);ctx.stroke()}}
    }
  }else if(type==='red'){
    if(mon){ctx.beginPath();ctx.moveTo(hx-7,y+4);ctx.lineTo(hx-10,y-8);ctx.lineTo(hx-2,y+2);ctx.fill();
      ctx.beginPath();ctx.moveTo(hx+7,y+4);ctx.lineTo(hx+10,y-8);ctx.lineTo(hx+2,y+2);ctx.fill()}
    if(pun)ctx.fillRect(hx+f*(reach+8)-3,y+19,6,6);
  }else{
    ctx.beginPath();ctx.arc(hx+f*11,y+11,3,0,7);ctx.fill();
    if(pun){ctx.beginPath();ctx.arc(hx+f*3,y+13,2.5,0,7);ctx.fill()}
  }
}
function guard(e){
  const x=e.x-camX,y=e.y;
  if(e.isRestaurante) {
    ctx.fillStyle='#111';
    ctx.fillRect(x+4,y+28,8,18);ctx.fillRect(x+14,y+28,8,18);
    ctx.fillStyle='#fff'; ctx.fillRect(x+4,y+14,18,16);
    ctx.fillStyle='#000'; ctx.fillRect(x+11,y+14,4,16);
    ctx.fillStyle='#f0c8a0';ctx.beginPath();ctx.arc(x+13,y+8,7,0,7);ctx.fill();
    ctx.fillStyle='#222'; ctx.fillRect(x+5,y,16,4);
    ctx.fillStyle='#ccc'; ctx.fillRect(e.vx>0?x+20:x-10,y+18,14,3);
  } else {
    ctx.fillStyle=e.col;
    ctx.fillRect(x+4,y+30,8,16);ctx.fillRect(x+14,y+30,8,16);
    ctx.fillRect(x+1,y+15,24,17);
    ctx.fillRect(x-3,y+16,5,14);ctx.fillRect(x+24,y+16,5,14);
    ctx.fillStyle='#fff';ctx.fillRect(x+10,y+15,6,8);
    ctx.fillStyle='#111';ctx.fillRect(x+12,y+17,2,12);
    ctx.fillStyle='#f5c518';ctx.fillRect(x+17,y+20,5,5);
    ctx.fillStyle='#f0c8a0';ctx.beginPath();ctx.arc(x+13,y+9,7,0,7);ctx.fill();
    ctx.fillStyle=e.col;ctx.fillRect(x+5,y,16,5);
    ctx.fillStyle='#000';ctx.fillRect(x+4,y+4,18,2);ctx.fillRect(x+7,y+8,12,3);
    if(e.isGuard){
      ctx.fillStyle='#ffcc00';ctx.fillRect(x+9,y+1,8,2);
    }
  }
  if(e.ch){ctx.fillStyle='#f33';ctx.font='bold 20px monospace';ctx.fillText('!',x+9,y-5)}
}
function bg1(){
  const sx=camX;
  ctx.fillStyle='#2b2540';ctx.fillRect(-sx,0,STUDIO,380);
  ctx.fillStyle='#d8d0c0';ctx.fillRect(STUDIO-sx,0,W-STUDIO,380);
  ctx.fillStyle='#1d1830';
  for(let i=0;i<STUDIO;i+=60){const x=i-sx;if(x<-60||x>800)continue;for(let j=0;j<6;j++)ctx.fillRect(x+5,15+j*58,50,50)}
  let x=500-sx;ctx.fillStyle='#7fb8d8';ctx.fillRect(x,70,200,90);ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.strokeRect(x,70,200,90);
  x=100-sx;ctx.fillStyle='#c01818';ctx.fillRect(x,30,70,26);ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText('ON AIR',x+7,48);
  [50,980].forEach(px=>{x=px-sx;ctx.fillStyle='#161616';ctx.fillRect(x,280,50,100);ctx.fillStyle='#444';ctx.beginPath();ctx.arc(x+25,315,13,0,7);ctx.fill();ctx.beginPath();ctx.arc(x+25,352,8,0,7);ctx.fill()});
  x=230-sx;ctx.fillStyle='#3d3d44';ctx.fillRect(x,335,170,45);ctx.fillStyle='#aaa';
  for(let k=0;k<8;k++)ctx.fillRect(x+10+k*20,342,4,18);
  x=700-sx;ctx.strokeStyle='#888';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,380);ctx.lineTo(x,300);ctx.stroke();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(x,292,9,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.fillRect(STUDIO-12-sx,0,24,380);
  ctx.fillStyle='#b5ab97';ctx.fillRect(STUDIO-sx,340,W-STUDIO,40);
  for(let i=1250;i<EXIT;i+=300){x=i-sx;if(x<-100||x>800)continue;ctx.fillStyle='#fff6c0';ctx.fillRect(x,0,80,8)}
  ctx.fillStyle='#3a2f55';ctx.fillRect(-sx,380,STUDIO,70);
  ctx.fillStyle='#6f6a60';ctx.fillRect(STUDIO-sx,380,W-STUDIO,70);
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-sx,380,W,6);
  x=EXIT-sx;ctx.fillStyle='#e8ffe8';ctx.fillRect(x-10,230,90,150);ctx.fillStyle='#4a2f14';ctx.fillRect(x,245,70,135);
  ctx.fillStyle='#1fa84a';ctx.fillRect(x,205,70,24);ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText('SAÍDA',x+9,222);
}
function bgCity(variant){
  const sx=camX;
  const g=ctx.createLinearGradient(0,0,0,380);
  if(variant===1){g.addColorStop(0,'#4a90e8');g.addColorStop(1,'#d8efff');}
  else if(variant===2){g.addColorStop(0,'#e87a4a');g.addColorStop(1,'#ffd8c0');}
  else{g.addColorStop(0,'#2a1f4e');g.addColorStop(1,'#6b4fa2');}
  ctx.fillStyle=g;ctx.fillRect(0,0,800,450);
  for(let i=0;i<30;i++){const bx=i*170-sx*.35,h=120+(i*53%110);if(bx>800||bx<-140)continue;
    ctx.fillStyle='#8aa0bf';ctx.fillRect(bx,380-h,130,h);ctx.fillStyle='#c9dcf2';
    for(let r=0;r<h-20;r+=26)for(let c=0;c<110;c+=30)ctx.fillRect(bx+10+c,380-h+12+r,14,14)}
  for(let i=0;i<20;i++){const bx=i*260-sx*.7+40,h=170+(i*71%100);if(bx>800||bx<-200)continue;
    ctx.fillStyle=['#4b5a78','#5d4a6e','#3f5f6a'][i%3];ctx.fillRect(bx,380-h,190,h);ctx.fillStyle='#ffe9a0';
    for(let r=0;r<h-30;r+=34)for(let c=0;c<170;c+=40)ctx.fillRect(bx+12+c,380-h+14+r,18,20);
    if(i%4==1){ctx.fillStyle='#111';ctx.fillRect(bx+20,380-h-40,150,34);ctx.fillStyle='#ff4fd8';ctx.font='bold 24px monospace';ctx.fillText('KPOP',bx+50,380-h-14)}}
  for(let i=0;i<9;i++){const x=i*400+150-sx;if(x<-30||x>830)continue;ctx.fillStyle='#333';ctx.fillRect(x,260,5,120);ctx.fillRect(x,258,24,5);ctx.fillStyle='#fff3a0';ctx.fillRect(x+16,263,10,6)}
  ctx.fillStyle='#454550';ctx.fillRect(-sx,380,W,70);
  ctx.fillStyle='#a8a8a8';ctx.fillRect(-sx,380,W,10);
  ctx.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<W;i+=120){const x=i-sx;if(x<-60||x>800)continue;ctx.fillRect(x,425,60,5)}
  const x=EXIT-sx;ctx.fillStyle='#2a2f3a';ctx.fillRect(x-10,230,90,150);ctx.fillStyle='#111';ctx.fillRect(x,250,70,130);
  ctx.fillStyle='#1fa84a';ctx.fillRect(x-10,205,90,24);ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText('SAÍDA',x+9,222);
}
function bgRestaurante(){
  const sx=camX;
  ctx.fillStyle='#3a1f1a';ctx.fillRect(0,0,800,380);
  for(let i=0;i<W;i+=150){const x=i-sx;ctx.fillStyle='#5c3328';ctx.fillRect(x,50,120,200);ctx.fillStyle='#fffae6';ctx.fillRect(x+15,70,90,120);}
  ctx.fillStyle='#543319';ctx.fillRect(-sx,380,W,70);
  ctx.fillStyle='#8b5a2b';ctx.fillRect(-sx,380,W,10);
  const x=EXIT-sx;ctx.fillStyle='#1fa84a';ctx.fillRect(x-10,205,90,24);ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText('SAÍDA',x+9,222);
}
function draw(){
  if(lvl===0) bg1();
  else if(lvl===1) bgCity(1);
  else if(lvl===2) bgCity(2);
  else if(lvl===3) bgCity(3);
  else if(lvl===4) bgCity(1);
  else if(lvl===5) bgCity(2);
  else bgRestaurante();

  if(!P||!plats)return;
  plats.forEach(p=>{
    const x=p.x-camX;
    if(lvl===6){ctx.fillStyle='#543319';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#3d220f';ctx.fillRect(x,p.y,p.w,8);}
    else if(lvl===0){ctx.fillStyle='#222';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#888';ctx.fillRect(x,p.y,p.w,5);}
    else{ctx.fillStyle='#454550';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#a8a8a8';ctx.fillRect(x,p.y,p.w,10);}
  });

  cars.forEach(car => {
    let cx = car.x - camX;
    ctx.fillStyle = car.col;
    ctx.fillRect(cx, car.y + 10, car.w, car.h - 10);
    ctx.fillRect(cx + 20, car.y, car.w - 40, 12);
    ctx.fillStyle = 'rgba(173, 216, 230, 0.8)';
    if(car.dir > 0) {
      ctx.fillRect(cx + car.w - 32, car.y + 2, 12, 10);
    } else {
      ctx.fillRect(cx + 20, car.y + 2, 12, 10);
    }
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(cx + 20, car.y + car.h, 7, 0, 7);
    ctx.arc(cx + car.w - 20, car.y + car.h, 7, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#aaa';
    ctx.beginPath();
    ctx.arc(cx + 20, car.y + car.h, 3, 0, 7);
    ctx.arc(cx + car.w - 20, car.y + car.h, 3, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#ff3';
    if(car.dir > 0) {
      ctx.fillRect(cx + car.w - 4, car.y + 14, 4, 6);
    } else {
      ctx.fillRect(cx, car.y + 14, 4, 6);
    }
  });

  en.forEach(e=>{if(e.alive)guard(e)});
  wv.forEach(w=>{
    const x=w.x-camX,cy=w.y+w.h/2,d=w.vx>0?1:-1;
    ctx.save();ctx.strokeStyle=w.big?'#ff6adf':'#5ac8ff';ctx.lineWidth=w.big?6:3;ctx.globalAlpha=Math.min(1,w.life/20);
    for(let i=0;i<3;i++){const r=w.h/2*(.5+i*.25),cx=x+(d>0?0:w.w)+d*i*(w.big?22:8);
      ctx.beginPath();ctx.arc(cx,cy,r,d>0?-.9:Math.PI-.9,d>0?.9:Math.PI+.9);ctx.stroke()}
    ctx.restore();
  });
  if(!(P.inv&&Math.floor(Date.now()/80)%2)){
    ctx.save();ctx.translate(P.x-camX,P.y+P.h);ctx.scale(P.s,P.s);
    if(P.mon){ctx.shadowColor='#f00';ctx.shadowBlur=18}
    stick(0,-48,CH[hero].col,P.f,P.punch>0||P.claw>0,CH[hero].reach,TYPE[hero],P.mon);
    ctx.restore();
  }
  if(P.dash){
    const sx=P.x-camX+P.w/2,sy=P.y+P.h/2,pl=Math.sin(Date.now()/60)*3;
    ctx.save();
    ctx.fillStyle='rgba(90,220,255,.35)';ctx.strokeStyle='#7df9ff';ctx.lineWidth=4;
    ctx.shadowColor='#7df9ff';ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(sx,sy,42+pl,0,7);ctx.fill();ctx.stroke();
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(sx,sy,34+pl,0.3,2.2);ctx.stroke();
    ctx.restore();
  }
}
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
